name: Bug report
description: Report a malfunction
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include reproduction steps and the behavior you expected.
    validations:
      required: true
  - type: input
    id: chrome-version
    attributes:
      label: Chrome version
      placeholder: 'e.g. 129.0.6668.100'
  - type: input
    id: sidekick-version
    attributes:
      label: Sidekick version
      placeholder: 'e.g. 0.1.0'
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: 'e.g. macOS 14.5'
  - type: textarea
    id: logs
    attributes:
      label: Console logs (optional)
      render: shell
