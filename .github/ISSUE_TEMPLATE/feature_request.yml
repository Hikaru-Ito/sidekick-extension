name: Feature request
description: Suggest a new feature
labels: [enhancement]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Why is this needed
      description: Describe the problem you're trying to solve or the use case.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would it work? UI sketches and behaviour are helpful.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - productivity
        - automation
        - developer
        - privacy
        - lifestyle
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
